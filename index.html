<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kayamouse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="site">
    <img class="nyn-dance" src="assets/nyndance.gif" alt="" aria-hidden="true" />

    <nav class="drawers" aria-label="Main navigation">
      <section class="drawer">
        <button class="drawer-toggle" type="button" aria-expanded="false" aria-controls="drawer-hi">
          <span>hi</span>
          <span class="drawer-symbol" aria-hidden="true">+</span>
        </button>
        <div class="drawer-panel" id="drawer-hi" aria-hidden="true">
          <div class="drawer-content">
            <!-- Put your hi/home content here. -->
          </div>
        </div>
      </section>

      <section class="drawer">
        <button class="drawer-toggle" type="button" aria-expanded="false" aria-controls="drawer-about">
          <span>about</span>
          <span class="drawer-symbol" aria-hidden="true">+</span>
        </button>
        <div class="drawer-panel" id="drawer-about" aria-hidden="true">
          <div class="drawer-content">
            <!-- Put your about content here. -->
          </div>
        </div>
      </section>

      <section class="drawer">
        <button class="drawer-toggle" type="button" aria-expanded="false" aria-controls="drawer-music">
          <span>music</span>
          <span class="drawer-symbol" aria-hidden="true">+</span>
        </button>
        <div class="drawer-panel" id="drawer-music" aria-hidden="true">
          <div class="drawer-content music-content">
            <div class="song">
              <video class="song-video" controls preload="metadata">
                <source src="assets/triplaneta.mp4" type="video/mp4" />
                Your browser does not support HTML5 video.
              </video>
              <div class="song-title">Triplaneta - Electrocutica (Ft. Kiyono/F9)</div>
            </div>

            <div class="song">
              <video class="song-video" controls preload="metadata">
                <source src="assets/uta.mp4" type="video/mp4" />
                Your browser does not support HTML5 video.
              </video>
              <div class="song-title">Hidamari no Uta - Yuyoyuppe</div>
            </div>
          </div>
        </div>
      </section>

      <section class="drawer">
        <button class="drawer-toggle" type="button" aria-expanded="false" aria-controls="drawer-touhou">
          <span>touhou</span>
          <span class="drawer-symbol" aria-hidden="true">+</span>
        </button>
        <div class="drawer-panel" id="drawer-touhou" aria-hidden="true">
          <div class="drawer-content">
            <!-- Put your touhou content here. -->
          </div>
        </div>
      </section>

      <section class="drawer">
        <button class="drawer-toggle" type="button" aria-expanded="false" aria-controls="drawer-nyn">
          <span>nyn</span>
          <span class="drawer-symbol" aria-hidden="true">+</span>
        </button>
        <div class="drawer-panel" id="drawer-nyn" aria-hidden="true">
          <div class="drawer-content">
            <!-- Put your nyn content here. -->
          </div>
        </div>
      </section>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
