<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kayamouse.com</title>
  <meta name="description" content="kayamouse.com">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="site">

    <header class="top">
      <img class="header-gif" src="assets/new%20nyn.gif" alt="">
      <div class="brand">
        <div class="site-name">kayamouse.com</div>
      </div>
    </header>

    <div class="layout">

      <aside class="sidebar" aria-label="navigation">
        <div class="side-title">contents</div>

        <nav class="nav" aria-label="site tabs">
          <button class="nav-button active" type="button" data-tab="home" aria-selected="true">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span class="nav-label">home</span>
          </button>

          <button class="nav-button" type="button" data-tab="music" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">♫</span>
            <span class="nav-label">music</span>
          </button>

          <button class="nav-button" type="button" data-tab="touhou" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">✦</span>
            <span class="nav-label">touhou</span>
          </button>

          <button class="nav-button" type="button" data-tab="nyn" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">🐭</span>
            <span class="nav-label">nyn</span>
          </button>

          <button class="nav-button" type="button" data-tab="person" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">♡</span>
            <span class="nav-label">my person</span>
          </button>

          <button class="nav-button" type="button" data-tab="photos" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">▧</span>
            <span class="nav-label">photos</span>
          </button>

          <button class="nav-button" type="button" data-tab="other" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">✧</span>
            <span class="nav-label">other things</span>
          </button>
        </nav>
      </aside>

      <main class="content">

        <section id="home" class="tab-content active">
          <div class="video-wrap">
            <video
              class="home-video"
              controls
              autoplay
              muted
              loop
              playsinline
              preload="metadata"
              poster="assets/background.jpg"
            >
              <source src="assets/original%20triplaneta%20video.mp4" type="video/mp4">
              Your browser does not support HTML5 video.
            </video>
          </div>
        </section>

        <section id="music" class="tab-content" hidden>
          <div class="placeholder-page">
            <h1>music</h1>
            <p>placeholder</p>
          </div>
        </section>

        <section id="touhou" class="tab-content" hidden>
          <div class="placeholder-page">
            <h1>touhou</h1>
            <p>placeholder</p>
          </div>
        </section>

        <section id="nyn" class="tab-content" hidden>
          <div class="placeholder-page">
            <h1>nyn</h1>
            <p>placeholder</p>
          </div>
        </section>

        <section id="person" class="tab-content" hidden>
          <div class="placeholder-page">
            <h1>my person</h1>
            <p>placeholder</p>
          </div>
        </section>

        <section id="photos" class="tab-content" hidden>
          <div class="placeholder-page">
            <h1>photos</h1>
            <p>placeholder</p>
          </div>
        </section>

        <section id="other" class="tab-content" hidden>
          <div class="placeholder-page">
            <h1>other things</h1>
            <p>placeholder</p>
          </div>
        </section>

      </main>
    </div>

    <footer>♡ kayamouse.com ♡</footer>
  </div>

  <script>
    const buttons = [...document.querySelectorAll(".nav-button")];
    const tabs = [...document.querySelectorAll(".tab-content")];

    function setTab(name, updateUrl = true) {
      const safe = document.getElementById(name) ? name : "home";

      tabs.forEach((tab) => {
        const active = tab.id === safe;
        tab.hidden = !active;
        tab.classList.toggle("active", active);
      });

      buttons.forEach((button) => {
        const active = button.dataset.tab === safe;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });

      if (updateUrl) {
        history.pushState({ tab: safe }, "", "#" + safe);
      }

      window.scrollTo(0, 0);
    }

    function currentTab() {
      return location.hash.slice(1) || "home";
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => setTab(button.dataset.tab));
    });

    window.addEventListener("popstate", () => setTab(currentTab(), false));
    window.addEventListener("hashchange", () => setTab(currentTab(), false));

    setTab(currentTab(), false);
  </script>
</body>
</html>
